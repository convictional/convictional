extends: spectral:oas

# Convictional's /api/ spec is auto-generated by FastAPI and consumed by codegen, not
# read by humans. We enforce REST basics — HTTP method semantics, status codes,
# schema correctness — and skip documentation/style rules from spectral:oas.

rules:
  # Documentation style — not REST basics.
  info-description: off
  info-contact: off
  info-license: off
  license-url: off
  contact-properties: off
  operation-description: off
  operation-tags: off
  operation-tag-defined: off
  operation-singular-tag: off
  openapi-tags: off
  openapi-tags-alphabetical: off
  tag-description: off
  oas3-parameter-description: off

  # Server metadata — auto-generated specs don't declare runtime servers.
  oas3-api-servers: off

  # FastAPI references components indirectly via response_model unions; the
  # "unused" detector trips on union arms that are reachable in practice.
  oas3-unused-component: off

  # Two selectors: the path-level one catches inline array schemas; the
  # components-level one catches FastAPI's named response models, which the
  # paths reference via `$ref` (no `type` field at the path-level schema).
  no-bare-array-response:
    description: List responses must use a paginated envelope, never a bare top-level array.
    message: "{{path}}: response schema is a bare array — wrap it in an envelope (e.g. PaginatedResponse subclass)."
    severity: error
    given:
      - $.paths[*][*].responses[*].content[*].schema
      - $.components.schemas[*]
    then:
      field: type
      function: pattern
      functionOptions:
        notMatch: "^array$"

  delete-must-return-204:
    description: DELETE operations must declare a 204 No Content response.
    message: "DELETE {{path}} is missing a 204 response."
    severity: error
    given:
      - $.paths[*].delete
    then:
      field: responses.204
      function: truthy
