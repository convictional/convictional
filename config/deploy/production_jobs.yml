apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: convictional-jobs
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      name: ${REVISION_NAME}
      annotations:
        autoscaling.knative.dev/minScale: "2"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/target: "10"
        run.googleapis.com/cloudsql-instances: ${GCP_PROJECT_ID}:${GCP_REGION}:convictional
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      timeoutSeconds: ${JOB_TIMEOUT_SECONDS}
      serviceAccountName: convictional-app@${GCP_PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - name: convictional-1
          image: ${CONTAINER_IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            # Startup budget = failureThreshold × periodSeconds = 180s. Set
            # generously because cold start is slow and variable, and with
            # minScale > 1 a single instance exceeding the budget fails the
            # whole revision's deploy.
            failureThreshold: 90
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          env:
            - name: ENV
              value: production
            - name: BASE_URL
              value: https://${APP_DOMAIN}
            - name: GCP_PROJECT
              value: ${GCP_PROJECT_ID}
            - name: GCP_PROJECT_NUMBER
              value: "${GCP_PROJECT_NUMBER}"
            - name: GCP_LOCATION
              value: ${GCP_REGION}
            - name: GCS_BUCKET
              value: ${GCS_BUCKET}
            - name: CLOUD_TASKS_SERVICE_ACCOUNT
              value: convictional-background-jobs@${GCP_PROJECT_ID}.iam.gserviceaccount.com
            - name: OPENAI_ORGANIZATION
              value: ${OPENAI_ORGANIZATION}
            - name: JOB_RUNNER
              value: cloud_tasks
            - name: JOB_TIMEOUT_SECONDS
              value: "${JOB_TIMEOUT_SECONDS}"
            - name: EMAIL_DELIVERY
              value: mailgun
            # Sender identities and the Mailgun sending domain. No defaults in source, and
            # this service is where the mailers actually run, so it needs the same values
            # as the web service. Startup fails without them.
            - name: EMAIL_FROM
              value: ${EMAIL_FROM}
            - name: RESEARCH_EMAIL_FROM
              value: ${RESEARCH_EMAIL_FROM}
            - name: MAILGUN_DOMAIN
              value: ${MAILGUN_DOMAIN}
            # feedback_email is also the VAPID subject, which this service needs because
            # push dispatch runs here.
            - name: FEEDBACK_EMAIL
              value: ${FEEDBACK_EMAIL}
            - name: SIGNUP_EMAIL
              value: ${SIGNUP_EMAIL}
            - name: NEW_USER_NOTIFICATION_EMAILS
              value: ${NEW_USER_NOTIFICATION_EMAILS}
            - name: JOBS_SERVICE_NAME
              value: convictional-jobs
            - name: CACHE_STORE
              value: postgres
            - name: POSTGRES_JSON
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_POSTGRES_JSON
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_OAUTH2_CLIENT_ID
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_OAUTH2_CLIENT_SECRET
            - name: MICROSOFT_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_MICROSOFT_OAUTH2_CLIENT_ID
            - name: MICROSOFT_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_MICROSOFT_OAUTH2_CLIENT_SECRET
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_SENTRY_DSN
            - name: SENTRY_ORG
              value: ${SENTRY_ORG}
            - name: SENTRY_PROJECT
              value: convictional
            - name: SENTRY_PROJECT_ID
              value: "${SENTRY_PROJECT_ID}"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_SECRET_KEY_BASE
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_ANTHROPIC_API_KEY
            - name: MAILGUN_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: MAILGUN_API_KEY
            - name: MAILGUN_WEBHOOK_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_MAILGUN_WEBHOOK_SIGNING_KEY
            - name: RECALL_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_RECALL_AI_API_KEY
            - name: RECALL_AI_WEBHOOK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_RECALL_AI_BOT_STATUS_WEBHOOK_SIGNING_SECRET
            - name: KLIPY_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_KLIPY_API_KEY
            - name: SLACK_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SLACK_OAUTH_CLIENT_ID
            - name: SLACK_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: SLACK_OAUTH_CLIENT_SECRET
            - name: PUSH_ENABLED
              value: "true"
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_VAPID_PUBLIC_KEY
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_VAPID_PRIVATE_KEY
            # Authenticates native (APNs-via-Expo) push sends once Expo's
            # enhanced push security is enabled for the project.
            - name: EXPO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_EXPO_ACCESS_TOKEN
            # Signup blocklists (see accounts.py: is_login_blocked / is_domain_banned).
            # Comma-separated. Sourced from Secret Manager rather than inline values so no
            # blocked identity (email, Google sub) or named domain lands in git history —
            # the whole reason these moved out of source. Absent secret → empty → no blocking.
            - name: BANNED_DOMAINS
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_BANNED_DOMAINS
            - name: BLOCKED_EMAILS
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_BLOCKED_EMAILS
            - name: BLOCKED_OAUTH_SUBS
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: CONVICTIONAL_BLOCKED_OAUTH_SUBS
            - name: EMAIL_CLIENT
              value: gmail
            - name: EMAIL_MESSAGES_ONBOARDING_SYNC_LIMIT
              value: "10000"
            - name: ENABLE_GMAIL_WATCH
              value: "true"
            - name: ASSET_HOST
              value: https://${CDN_DOMAIN}
            - name: STATIC_ASSET_URL_PREFIX
              value: "/"
            - name: WORKER_COUNT
              value: "2"

  traffic:
    - percent: 100
      revisionName: ${SERVING_REVISION_NAME}
