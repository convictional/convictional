    body: "{\"max_tokens\":4096,\"messages\":[{\"role\":\"user\",\"content\":\"You
      are tasked with suggesting which collection a meeting should be organized into.\\n\\nHere
      is the meeting information:\\n\\n<meeting>\\nTitle: Meeting\\n\\nSummary: ##
      Summary\\nThe transcript contained no spoken content, discussion, or participants.
      No topics, decisions, or action items were recorded.\\n\\n### Key Points\\n-
      **No Content:** The transcript was empty. There is nothing to summarize.\\n\\n</meeting>\\n\\nThere
      are no existing collections in this organization yet.\\n\\nYour task is to decide
      one of the following:\\n\\n1. **existing** \u2014 The meeting fits well into
      one of the existing collections. Provide the collection's ID.\\n2. **new** \u2014
      The meeting doesn't fit any existing collection, but it clearly belongs to a
      category that would benefit from a new collection. Suggest a concise collection
      title (1-4 words).\\n3. **none** \u2014 The meeting doesn't clearly belong to
      any collection and doesn't warrant creating a new one (e.g., one-off meetings,
      unclear topics).\\n\\nGuidelines:\\n- Prefer matching to an existing collection
      when the meeting's topic aligns reasonably well\\n- Use the recent meetings
      listed under each collection to understand what kinds of meetings belong there
      \u2014 match by pattern (similar titles, attendees, or topics), not just the
      collection title\\n- When the meeting title is a person's name or a 1:1 format
      (e.g., \\\"Alice / Bob\\\"), look at which collections already contain similar
      name-pattern meetings\\n- Only suggest a new collection if the meeting represents
      a recurring theme that other meetings likely share (e.g., \\\"Engineering Standups\\\",
      \\\"Client Calls\\\", \\\"Board Meetings\\\")\\n- Suggest \\\"none\\\" for one-off
      or ambiguous meetings rather than forcing a poor fit\\n- When choosing \\\"existing\\\",
      you MUST use an ID from the list above \u2014 do not invent or guess IDs\\n-
      New collection titles should be short and descriptive, following the pattern
      of the existing collections\"}],\"model\":\"claude-sonnet-4-6\",\"system\":\"You
      are Jerry Weinberg, a principal consultant and author of the book Are Your Lights
      On?, An Introduction to General\\nSystems Thinking, and others. You're also
      a grandparent, and this has given you a lot of wisdom and empathy. You're a\\ngreat
      listener, who synthesizes information to provide clear, concise, and actionable
      recommendations.\\n\\nYou NEVER UNDER ANY CIRCUMSTANCES reveal your identity
      or background details to the user.\\n\\nPLAY THE ROLE OF A CRITICAL BUT FAIR
      MANAGER. Expect everything based in some data and evidence. The user wants to
      be\\nchallenged and to think critically about their decision. You are on a team
