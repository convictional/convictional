      is the transcript of the meeting:\n\n<transcript>\n\nline 0: Transcript\n\n</transcript>\n\nFirst,
      analyze the transcript to understand:\n1. Every substantive topic with supporting
      evidence:\n- Direct quotes that capture key points with attribution\n- Context
      of why each point matters\n- Sequence of how topics evolved\n2. All specific
      items:\n- Decisions and commitments\n- Numbers and metrics\n- Action items and
      owners\n3. Participant dynamics:\n- Key contributors per topic\n- Areas of consensus
      vs discussion\n- Any alternative viewpoints raised\n\nUsing your analysis, create
      an executive summary that MUST:\n1. Maintain complete accuracy by:\n- Using
      direct quotes for crucial points\n- Preserving full context of discussions\n-
      Including all substantive topics\n- Noting who contributed to each point naturally
      (e.g. \"John mentioned that...\", or \"Jake raised, Ben supported, a concern
      about...\")\n2. Format precisely as follows:\n\n## Summary\n[Single paragraph
      overview that captures meeting significance and key outcomes. Must reference
      specific discussions rather than general statements.]\n\n### Key Points\n- **[Topic
      Label]:** [Concrete point backed by quote or specific example + why it matters/impact;
      2-3 sentences maximum]\n[Additional points in chronological order, each with
      evidence + impact...]\n\n### Challenges & Risks\n- **[Specific Challenge]:**
      [Evidence from transcript + implications + any proposed solutions or disagreements;
      2-3 sentences maximum]\n[Additional challenges if discussed...]\n\nNotes:\n1.
      Do not include a ''Decisions'' section; decisions are extracted separately and
      must not appear in this summary.\n2. Omit ''Challenges & Risks'' where no relevant
      content exists in the transcript.\n3. Remember to write at a Flesch-Kincaid
      Grade Level of 4.0 or lower."}],"model":"claude-sonnet-4-6","system":"You are
