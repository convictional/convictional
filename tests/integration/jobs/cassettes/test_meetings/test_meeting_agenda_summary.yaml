      the next morning.\nline 9: Owen Trask: So the data is a day stale before anyone
      reads it.\nline 10: Marta Delgado: A day stale and frequently wrong. He said
      they reconcile twice a month and each reconciliation costs two people a full
      day. That is the pain. He was not asking for software. He was describing a problem
      he has stopped expecting anyone to solve.\nline 11: Felix Bourne: Can you say
      what the value driver is for them? If I have to write this up, I want one sentence.\nline
      12: Marta Delgado: One sentence is that they stop paying for the reconciliation.
      Two people, two days a month, plus the write-offs they take when the count is
      wrong and they order stock they already have. He put the write-offs at about
      forty thousand a year across four sites.\nline 13: Owen Trask: That number is
      bigger than the labour cost.\nline 14: Marta Delgado: Much bigger, and it is
      the number he is judged on. That is why I want us to treat Redwood Freight as
      the pilot rather than Harbourline. Harbourline is friendlier and would say yes
      faster, but they have one warehouse and no reconciliation problem, so we would
      learn nothing.\nline 15: Priya Raman: Agreed. I would rather work with the harder
      site.\nline 16: Marta Delgado: Let me finish the goals and then we can open
      it up. The annual goal is five warehouses running the full workflow by December,
      and that one is at risk. We have two. Alto Grocers is the only site using scanning,
      counts and label printing together, and Harbourline only uses label printing.\nline
      17: Felix Bourne: Harbourline told me last week they want to add counts in April.
      That would be a third if it holds.\nline 18: Marta Delgado: If it holds. I am
      marking the goal at risk regardless, because three of the five have to come
      from sites we have not met yet, and our demo rate does not support that.\nline
      19: Owen Trask: What would change the rate?\nline 20: Marta Delgado: Either
      more demos or a higher conversion from demo to pilot. I would rather work on
      the second one, because the first is a headcount question and we are not solving
      that this quarter.\nline 21: Priya Raman: Then let us move to the open decisions,
      because the first one is exactly the conversion question.\nline 22: Marta Delgado:
      Go ahead.\nline 23: Priya Raman: The Redwood Freight pilot scope. We have four
      things on the list: stock counts, label printing, offline mode, and low stock
      alerts. Label printing is done and shipped. Stock counts work on the web but
      not on the scanner. Offline mode does not exist. Alerts do not exist.\nline
      24: Owen Trask: Offline mode is the one I want to talk about, because it is
      the largest of the four by a wide margin and it changes the shape of the mobile
      app.\nline 25: Marta Delgado: Say more.\nline 26: Owen Trask: Right now the
      scanner posts every scan to the server and waits for a response before it accepts
      the next one. If we support offline, every scan has to be queued on the device,
      and then we need a merge step for when two people count the same aisle while
      disconnected. That merge step is the real work. It is not a week.\nline 27:
      Priya Raman: How long is it?\nline 28: Owen Trask: Three weeks for the queue
      and the merge, plus whatever the first pilot teaches us. Call it a month before
      it is trustworthy.\nline 29: Felix Bourne: Does Redwood Freight actually have
      dead zones? I have been assuming they do because warehouses usually do, but
      I have not asked.\nline 30: Marta Delgado: I asked. Two of their four sites
      have poor coverage in the tall racking at the back. The other two are fine.
      Their operations lead described it as an annoyance rather than a blocker.\nline
      31: Owen Trask: That changes my read. If it were four out of four I would build
      it first.\nline 32: Priya Raman: Then here is the alternative. We ship the scanner
      online only for the pilot, we start on the first of April, and we watch how
      often a scan fails. If it fails often enough to hurt them, we build offline
      mode with real evidence about what the merge needs to handle.\nline 33: Owen
      Trask: My worry is that we ship something that fails in the back of the racking
      on day one and they conclude the product does not work. First impressions with
      operations teams are hard to undo.\nline 34: Felix Bourne: We can put a queue
