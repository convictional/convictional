      from a new collection. Suggest a concise collection title (1-4 words).\\n3.
      **none** \u2014 The meeting doesn't clearly belong to any collection and doesn't
      warrant creating a new one (e.g., one-off meetings, unclear topics).\\n\\nGuidelines:\\n-
      Prefer matching to an existing collection when the meeting's topic aligns reasonably
      well\\n- Use the recent meetings listed under each collection to understand
      what kinds of meetings belong there \u2014 match by pattern (similar titles,
      attendees, or topics), not just the collection title\\n- When the meeting title
      is a person's name or a 1:1 format (e.g., \\\"Alice / Bob\\\"), look at which
      collections already contain similar name-pattern meetings\\n- Only suggest a
      new collection if the meeting represents a recurring theme that other meetings
