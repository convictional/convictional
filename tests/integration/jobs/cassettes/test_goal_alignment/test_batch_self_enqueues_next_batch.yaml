interactions:
- request:
    body: '{"max_tokens": 4096, "messages": [{"role": "user", "content": "<goal>\nGrow
      annual recurring revenue by 20% through new customer acquisition and upselling.\n</goal>\n\n<content>\n<type>meeting</type>\n<title>Q1
      Sales Pipeline Review</title>\n<body>Discussed strategies to close three enterprise
      deals worth $500K total.</body>\n</content>\n\n<similarity_score>0.707</similarity_score>\n\nIs
      this content aligned with the goal?"}], "model": "claude-haiku-4-5", "system":
      "You are an expert at analyzing whether business content aligns with organizational
      goals.\n\nYou will be given a piece of content from a business collaboration
      tool (emails, meetings, tasks, discussions, etc.) and an organizational goal.\nYour
      job is to determine if the content is related to the goal.\n\nThe goal information
      includes its title, description, ownership, status, progress, subgoals, and
      recent updates. Use all of this context to understand what the goal is about
      and what progress looks like \u2014 not just the title.\n\n## Signal Strength\n\nFirst,
      determine if the content has any meaningful relationship to the goal. Most content
      will be unrelated \u2014 set is_aligned to false when:\n- The content discusses
      entirely different topics, projects, or concerns\n- Any apparent connection
      is superficial, coincidental, or based only on shared terminology\n- The content
      is in the same general domain but doesn''t relate to a specific aspect of this
      goal\n- You would not expect someone tracking this goal to take any action based
      on this content\n\nIf the content IS meaningfully related, classify the alignment
      as one of:\n- **strong**: The content directly mentions, discusses, or advances
      this goal. The connection is explicit and unmistakable.\n- **medium**: The content
      references specific activities, decisions, or outcomes that clearly relate to
      this goal, even if the goal isn''t mentioned by name.\n- **weak**: The content
      discusses a specific initiative, project, or action that has a concrete \u2014
      but not immediately obvious \u2014 connection to this goal. Mere topical overlap
      or shared terminology is NOT enough for a weak signal.\n\n## Similarity Score\n\nYou
      will be given a cosine similarity score between the content and goal embeddings
      (0.0 to 1.0). Use it as a prior:\n- **0.7+**: High semantic similarity \u2014
      content likely discusses related topics\n- **0.5-0.7**: Moderate similarity
      \u2014 worth evaluating but don''t assume alignment\n- **0.3-0.5**: Low similarity
      \u2014 alignment is unlikely unless there''s a clear, specific connection\n\nThe
      similarity score measures topical overlap, not alignment. Two documents about
      \"sales\" may be similar but unrelated to a specific sales goal. Use the score
      to calibrate your confidence, not as a direct measure of alignment.\n\n## Alignment
      Score\n\nRate how aligned the content is with the goal from 0.0 to 1.0:\n- 0.9-1.0:
      Certain \u2014 the alignment is unambiguous\n- 0.7-0.8: Confident \u2014 strong
      evidence supports the judgment\n- 0.5-0.6: Moderate \u2014 the relationship
      is plausible but requires interpretation\n- 0.3-0.4: Low \u2014 the connection
      is speculative\n\n## Description\n\nIf aligned, provide a concise 1-2 sentence
      explanation of how the content relates to the goal. Focus on the specific connection,
      not a general summary of the content.\n\nYou may be given examples of content
      that users have confirmed as aligned or not aligned with the goal. Use these
      to calibrate your judgment \u2014 they reflect what this organization considers
      relevant.\n\nBe objective and calibrated. Not all content aligns to a goal.
      It is perfectly normal and expected for content to be unrelated.\nIf you are
      unsure, it''s better to rate the content as unaligned than to overstate the
      connection.", "temperature": 0.0, "tool_choice": {"type": "tool", "name": "AlignmentJudgment"},
      "tools": [{"name": "AlignmentJudgment", "description": "Correctly extracted
      `AlignmentJudgment` with all the required parameters with correct types", "input_schema":
      {"$defs": {"SignalStrength": {"enum": ["strong", "medium", "weak"], "title":
      "SignalStrength", "type": "string"}}, "properties": {"is_aligned": {"description":
      "Whether the content is meaningfully aligned with the goal", "title": "Is Aligned",
      "type": "boolean"}, "signal": {"anyOf": [{"$ref": "#/$defs/SignalStrength"},
      {"type": "null"}], "default": null, "description": "The strength of the alignment
      signal: strong, medium, or weak. Only set if is_aligned is true."}, "alignment_score":
      {"description": "How aligned is the content with the goal from 0.0 to 1.0",
      "maximum": 1.0, "minimum": 0.0, "title": "Alignment Score", "type": "number"},
      "description": {"anyOf": [{"type": "string"}, {"type": "null"}], "default":
      null, "description": "A concise 1-2 sentence explanation of how the content
      relates to the goal. Only set if is_aligned is true.", "title": "Description"}},
      "required": ["is_aligned", "alignment_score"], "title": "AlignmentJudgment",
      "type": "object"}}]}'
