- request:
    body: '{"max_tokens": 4096, "messages": [{"role": "user", "content": "Given the
      following prompt from the user, generate a list of queries to research the topic.\n<topic>Information
      about quantum flux capacitors in our system</topic>\n\nReturn a maximum of 1
      queries, but feel free to return less if the original prompt is clear.\n\n##
      Source selection\n\n### Internal source query instructions:\n\n- You must return
      source: internal to indicate these queries are for searching internal organization
      content.\n- You''ll be searching organization activity and documents to help
      the user explore and answer this question.\n- Query terms should be short (less
      than 5 words, ideally 3 or less) for a basic embedding and TD/IDF search.\n-
      If the text seems like a good search on its own, just return the text as entered.\n-
      Anything related to time (e.g. \"recent\", \"last month\", \"this week\") should
      be translated into a specific date range.\n- If you see a specific date, use
      that date range. If you see a general date (e.g. \"recently\", \"last month\"),
      use the last 30 days, respecting the current date and time.\n- If you recognize
      named entities, surround them with double quotes (e.g. \"Hulk Hogan\", \"Apple\").
      Consider if an capitalized word is a named entity.\n\n## Date ranges\n\nIn your
      response, you may include a starts_at and ends_at date range for each query
      if the topic or directions indicate a specific time period.\n\nIMPORTANT: Today''s
      date is 2026-08-05. The current year is 2026. Use this as your reference point
      for all date calculations.\n\n- Reference Point: Calculate all relative dates
      based on today''s date: 2026-08-05.\n- Format: Return timestamps in ISO 8601
      format: YYYY-MM-DDTHH:MM:SS.\n- Boundaries: Start of day is 00:00:00 and End
      of day is 23:59:59.\n- Default Year: If a month or quarter is specified without
      a year, use 2026.\n- Absence: If no date range is specified, do not include
      starts_at or ends_at fields.\n\nRelative Date Logic\n\n- \"today\" \u2192 starts_at:
      Current Date T00:00:00, ends_at: Current Date T23:59:59\n- \"yesterday\" \u2192
      starts_at: Previous Date T00:00:00, ends_at: Previous Date T23:59:59\n- \"this
      week\" \u2192 starts_at: Monday of current week, ends_at: Sunday of current
      week\n- \"last week\" \u2192 starts_at: Monday of previous week, ends_at: Sunday
      of previous week\n- \"this month\" \u2192 starts_at: Day 1 of current month,
      ends_at: Last day of current month\n- \"last month\" \u2192 starts_at: Day 1
      of previous month, ends_at: Last day of previous month\n- \"this year\" \u2192
      starts_at: Jan 1 of current year, ends_at: Dec 31 of current year\n- \"recently\",
      \"lately\", or vague time \u2192 starts_at: (Current Date - 30 days), ends_at:
      Current Date\n\nBusiness Date Ranges\n- \"Q1\" / \"first quarter\" \u2192 Jan
      1 to Mar 31\n- \"Q2\" / \"second quarter\" \u2192 Apr 1 to June 30\n- \"Q3\"
      / \"third quarter\" \u2192 July 1 to Sept 30\n- \"Q4\" / \"fourth quarter\"
      \u2192 Oct 1 to Dec 31\n- \"H1\" / \"first half\" \u2192 Jan 1 to June 30\n-
      \"H2\" / \"second half\" \u2192 July 1 to Dec 31\n\nNote: Apply the current
      year (2026) unless a specific year is mentioned.\n\nExamples (using today''s
      date 2026-08-05):\nQuery: \"Q3 sales targets\"\nterms: \"sales targets\", starts_at:
      \"2026-07-01T00:00:00\", ends_at: \"2026-09-30T23:59:59\"\n\nQuery: \"last month''s
      revenue\"\nterms: \"revenue\", starts_at: \"2026-07-01T00:00:00\", ends_at:
      \"2026-07-31T23:59:59\"\n\nQuery: \"Q4 2023 results\"\nterms: \"results\", starts_at:
      \"2023-10-01T00:00:00\", ends_at: \"2023-12-31T23:59:59\"\n\n## Existing Queries
      and Learnings\n\nThe following existing queries and learnings are provided to
      help you avoid duplication and improve the specificity of your generated queries."}],
      "model": "claude-sonnet-4-6", "system": "The current datetime is 2026-08-05
      16:47:29.986015+00:00\n\nThe user you are helping is foo-1855@example.com whose
      email address is foo-1855@example.com.\n\nYou are an expert researcher. Today
      is 2026-08-05 16:47:29.986076+00:00. Follow these instructions when responding:\n-
      You may be asked to research subjects that is after your knowledge cutoff, assume
      the user is right when presented with news.\n- Be highly organized.\n- Suggest
      solutions that I didn''t think about.\n- Be proactive and anticipate my needs.\n-
      Treat me as an expert in all subject matter.\n- Mistakes erode my trust, so
      be accurate and thorough.\n- Value good arguments over authorities, the source
      is irrelevant.\n- Consider new technologies and contrarian ideas, not just the
      conventional wisdom.\n- You may use high levels of speculation or prediction,
      just flag it for me.", "temperature": 0.0, "tool_choice": {"type": "tool", "name":
      "IterableGeneratedResearchQuery"}, "tools": [{"name": "IterableGeneratedResearchQuery",
      "description": "Correct segmentation of `GeneratedResearchQuery` tasks", "input_schema":
      {"$defs": {"GeneratedResearchQuery": {"properties": {"title": {"description":
      "A user-facing title for the query, it''ll be prefaced with ''Reading about''
      in the UI", "title": "Title", "type": "string"}, "terms": {"description": "The
      search terms", "title": "Terms", "type": "string"}, "starts_at": {"anyOf": [{"format":
      "date-time", "type": "string"}, {"type": "null"}], "default": null, "description":
      "The earliest datetime to allow results", "title": "Starts At"}, "ends_at":
      {"anyOf": [{"format": "date-time", "type": "string"}, {"type": "null"}], "default":
      null, "description": "The latest datetime to allow results", "title": "Ends
      At"}, "goals": {"description": "First talk about the goal of the research that
      this query is meant to accomplish, then go deeper into how to advance the research
      once the results are found, mention additional research directions. Be as specific
      as possible, especially for additional research directions.", "title": "Goals",
      "type": "string"}, "source": {"$ref": "#/$defs/ResearchSource", "default": "internal",
      "description": "The source to use for this research query"}}, "required": ["title",
      "terms", "goals"], "title": "GeneratedResearchQuery", "type": "object"}, "ResearchSource":
      {"enum": ["internal", "slack"], "title": "ResearchSource", "type": "string"}},
      "description": "Correct segmentation of `GeneratedResearchQuery` tasks", "properties":
      {"tasks": {"description": "Correctly segmented list of `GeneratedResearchQuery`
      tasks", "items": {"$ref": "#/$defs/GeneratedResearchQuery"}, "title": "Tasks",
      "type": "array"}}, "title": "IterableGeneratedResearchQuery", "type": "object"}}]}'
