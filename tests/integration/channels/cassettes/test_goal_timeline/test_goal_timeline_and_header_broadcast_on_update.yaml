      sure early customers stick and get value\"\nTitle: Retention\n\nGoal: \"Acquire
      our first meaningful set of paying customers\"\nTitle: Conversion\n\nGoal: \"Figure
      out how customers find and buy from us\"\nTitle: Discover\n\nGoal: \"New features
