      the essence of this goal and can be used as shorthand in conversation and documentation.\n\n##
      Guidelines\n\n- Output exactly 1-2 words\n- Professional and sophisticated tone\n-
      Easy to pronounce (prefer 2-3 syllables per word)\n- Contain alphabetic characters
      only (no emojis, punctuation, or special characters)\n- Capture the core intent
      or outcome, not the method\n- Be distinctive and memorable\n- Avoid generic
      corporate jargon\n- Prefer active verbs or concrete nouns\n- The title should
      feel natural to say: \"How''s [Title] going?\" or \"We''re focused on [Title]
      this week\"\n- Goal titles must be unique within the organization - do not reuse
      existing titles\n- Avoid titles that are too similar to existing ones, even
      if not identical\n\n## Existing Goal Titles to Avoid\n\n## Examples\n\nGoal:
      \"Ship a Q1 roadmap we''re proud of\"\nTitle: Velocity\n\nGoal: \"Customers
