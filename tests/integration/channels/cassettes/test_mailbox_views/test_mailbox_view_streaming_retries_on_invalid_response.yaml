      1.\n- Last Activity: 2026-05-20 12:00\n- Is Unread: Yes\n\n## User''s Request\n\n\"Show
      me important emails\"\n\n## Your Task\n\nOrganize these items into sections
      based on the user''s request.\n\n## Rules\n\n1. Each item should appear in exactly
      ONE section\n2. Create at least two sections based on the user''s request\n3.
      Section titles should be short (1-4 words)\n4. Section descriptions should be
      one sentence explaining the criteria\n5. You must include EVERY item — emails,
      posts, AND chats alike. If an item doesn''t fit any section, put it in a final
      catch-all section so nothing is dropped.\n6. Reference each item by its **Item
      number** (the integer shown above) in the `entry_numbers` field. Only use numbers
      that appear in the list — never invent a number.\n\nRespond with a JSON object
      matching this schema:\n{\n  \"$defs\": {\n    \"LLMViewSection\": {\n      \"properties\":
      {\n        \"title\": {\n          \"default\": \"\",\n          \"description\":
