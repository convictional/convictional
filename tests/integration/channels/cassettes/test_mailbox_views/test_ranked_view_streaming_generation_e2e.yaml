      Subject: Important Conversation 1\n- Preview: This is the preview of conversation
      1.\n- Last Activity: 2026-05-20 12:00\n- Is Unread: Yes\n\n## User''s Request\n\n\"Rank
      my inbox so the most urgent conversations come first\"\n\n## Your Task\n\nFor
      each item, assign a score from 0.0 to 1.0 for how well it matches the request
      (1.0 = highest priority, 0.0 = irrelevant). The server sorts the items by score,
      so the order you list them in does not matter \u2014 only the scores do.\n\n##
      Rules\n\n1. Score EVERY item exactly once, referencing it by its **Item number**
      (the integer shown above) in the `entry_number` field. Only use numbers that
      appear in the list \u2014 never invent a number.\n2. Do not omit or duplicate
      any item.\n3. Use the full range: reserve scores near 1.0 for the items that
      most need attention and scores near 0.0 for items that are irrelevant to the
      request. Calibrate each item on its own merits \u2014 do not assign evenly spaced
      ranks.\n\nRespond with a JSON object matching this schema:\n{\n  \"$defs\":
      {\n    \"LLMRankedEntry\": {\n      \"properties\": {\n        \"entry_number\":
      {\n          \"anyOf\": [\n            {\n              \"type\": \"integer\"\n            },\n            {\n              \"type\":
      \"null\"\n            }\n          ],\n          \"default\": null,\n          \"description\":
      \"The item number (the integer N from ''Item N'' in the list above)\",\n          \"title\":
      \"Entry Number\"\n        },\n        \"score\": {\n          \"anyOf\": [\n            {\n              \"maximum\":
      1.0,\n              \"minimum\": 0.0,\n              \"type\": \"number\"\n            },\n            {\n              \"type\":
      \"null\"\n            }\n          ],\n          \"default\": null,\n          \"description\":
      \"Priority against the request, 1.0 = highest, 0.0 = irrelevant\",\n          \"title\":
      \"Score\"\n        }\n      },\n      \"title\": \"LLMRankedEntry\",\n      \"type\":
      \"object\"\n    }\n  },\n  \"properties\": {\n    \"entries\": {\n      \"description\":
      \"A score for every item\",\n      \"items\": {\n        \"$ref\": \"#/$defs/LLMRankedEntry\"\n      },\n      \"title\":
      \"Entries\",\n      \"type\": \"array\"\n    }\n  },\n  \"title\": \"LLMMailboxRankResponse\",\n  \"type\":
