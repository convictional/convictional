      me important emails\"\n\n## Your Task\n\nOrganize these items into sections
      based on the user''s request.\n\n## Rules\n\n1. Each item should appear in exactly
      ONE section\n2. Create at least two sections based on the user''s request\n3.
      Section titles should be short (1-4 words)\n4. Section descriptions should be
      one sentence explaining the criteria\n5. You must include EVERY item \u2014
      emails, posts, AND chats alike. If an item doesn''t fit any section, put it
      in a final catch-all section so nothing is dropped.\n6. Reference each item
      by its **Item number** (the integer shown above) in the `entry_numbers` field.
      Only use numbers that appear in the list \u2014 never invent a number.\n\nRespond
      with a JSON object matching this schema:\n{\n  \"$defs\": {\n    \"LLMViewSection\":
      {\n      \"properties\": {\n        \"title\": {\n          \"default\": \"\",\n          \"description\":
      \"Short title for this section\",\n          \"title\": \"Title\",\n          \"type\":
      \"string\"\n        },\n        \"description\": {\n          \"default\": \"\",\n          \"description\":
      \"Brief description of what belongs in this section\",\n          \"title\":
      \"Description\",\n          \"type\": \"string\"\n        },\n        \"entry_numbers\":
      {\n          \"description\": \"The item numbers (the integer N from ''Item
      N'' in the list above) that belong in this section\",\n          \"items\":
      {\n            \"type\": \"integer\"\n          },\n          \"title\": \"Entry
      Numbers\",\n          \"type\": \"array\"\n        },\n        \"goal_id\":
      {\n          \"anyOf\": [\n            {\n              \"type\": \"string\"\n            },\n            {\n              \"type\":
      \"null\"\n            }\n          ],\n          \"default\": null,\n          \"description\":
      \"ID of the goal this section relates to, if any\",\n          \"title\": \"Goal
      Id\"\n        }\n      },\n      \"title\": \"LLMViewSection\",\n      \"type\":
      \"object\"\n    }\n  },\n  \"properties\": {\n    \"sections\": {\n      \"description\":
      \"Sections organizing the items\",\n      \"items\": {\n        \"$ref\": \"#/$defs/LLMViewSection\"\n      },\n      \"title\":
      \"Sections\",\n      \"type\": \"array\"\n    }\n  },\n  \"title\": \"LLMMailboxViewResponse\",\n  \"type\":
