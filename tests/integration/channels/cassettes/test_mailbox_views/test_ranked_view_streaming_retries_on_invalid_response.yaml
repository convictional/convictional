      items against my request."}],"model":"claude-sonnet-4-6","stream":true,"system":"The
      current datetime is 2026-05-20 12:00:00+00:00\n\nThe user you are helping is
      ranked-e2e@convictional.com whose email address is ranked-e2e@convictional.com.\n\nYou
      are helping a user prioritize their inbox into a single ranked list. The inbox
      holds different kinds of items — emails, posts (team announcements and discussions),
      and chats (direct and group messages). Your task is to score each item by how
      well it matches the user''s request so the most important items can be surfaced
      first.\n\n## Inbox Items\n\n**Item 1** (Email):\n- Subject: Important Conversation
      5\n- Preview: This is the preview of conversation 5.\n- Last Activity: 2026-05-20
      12:00\n- Is Unread: Yes\n\n**Item 2** (Email):\n- Subject: Important Conversation
      4\n- Preview: This is the preview of conversation 4.\n- Last Activity: 2026-05-20
      12:00\n- Is Unread: Yes\n\n**Item 3** (Email):\n- Subject: Important Conversation
      3\n- Preview: This is the preview of conversation 3.\n- Last Activity: 2026-05-20
      12:00\n- Is Unread: Yes\n\n**Item 4** (Email):\n- Subject: Important Conversation
      2\n- Preview: This is the preview of conversation 2.\n- Last Activity: 2026-05-20
      12:00\n- Is Unread: Yes\n\n**Item 5** (Email):\n- Subject: Important Conversation
      1\n- Preview: This is the preview of conversation 1.\n- Last Activity: 2026-05-20
      12:00\n- Is Unread: Yes\n\n## User''s Request\n\n\"Rank my inbox so the most
      urgent conversations come first\"\n\n## Your Task\n\nFor each item, assign a
      score from 0.0 to 1.0 for how well it matches the request (1.0 = highest priority,
      0.0 = irrelevant). The server sorts the items by score, so the order you list
      them in does not matter — only the scores do.\n\n## Rules\n\n1. Score EVERY
      item exactly once, referencing it by its **Item number** (the integer shown
      above) in the `entry_number` field. Only use numbers that appear in the list
      — never invent a number.\n2. Do not omit or duplicate any item.\n3. Use the
      full range: reserve scores near 1.0 for the items that most need attention and
      scores near 0.0 for items that are irrelevant to the request. Calibrate each
      item on its own merits — do not assign evenly spaced ranks.\n\nRespond with
      a JSON object matching this schema:\n{\n  \"$defs\": {\n    \"LLMRankedEntry\":
      {\n      \"properties\": {\n        \"entry_number\": {\n          \"anyOf\":
      [\n            {\n              \"type\": \"integer\"\n            },\n            {\n              \"type\":
      \"null\"\n            }\n          ],\n          \"default\": null,\n          \"description\":
      \"The item number (the integer N from ''Item N'' in the list above)\",\n          \"title\":
      \"Entry Number\"\n        },\n        \"score\": {\n          \"anyOf\": [\n            {\n              \"maximum\":
      1.0,\n              \"minimum\": 0.0,\n              \"type\": \"number\"\n            },\n            {\n              \"type\":
      \"null\"\n            }\n          ],\n          \"default\": null,\n          \"description\":
      \"Priority against the request, 1.0 = highest, 0.0 = irrelevant\",\n          \"title\":
      \"Score\"\n        }\n      },\n      \"title\": \"LLMRankedEntry\",\n      \"type\":
      \"object\"\n    }\n  },\n  \"properties\": {\n    \"entries\": {\n      \"description\":
      \"A score for every item\",\n      \"items\": {\n        \"$ref\": \"#/$defs/LLMRankedEntry\"\n      },\n      \"title\":
      \"Entries\",\n      \"type\": \"array\"\n    }\n  },\n  \"title\": \"LLMMailboxRankResponse\",\n  \"type\":
      \"object\"\n}\n\nOutput ONLY the JSON object itself. No preface, no markdown
      code fences, no trailing commentary.","temperature":0.0}'
