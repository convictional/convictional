    body: '{"input":["Title: Q4 Campaign Ad Spend Strategy and Platform Focus\nDate:
      No date\nAttendees: Tom Wilson, Sarah Chen, Maya Patel, James Rodriguez\nAgenda:
      No agenda\nSummary: ## Summary\nThe team held their weekly Q4 campaign sync,
      led by Tom Wilson. The main focus was where to put the ad budget. Sarah Chen
      shared that test campaign click-through rates hit 3.2%, up 0.8% from past campaigns.
      The team debated going broad across all platforms versus focusing on Instagram
      and LinkedIn. They chose to focus on Instagram and LinkedIn to hit a 15% increase
      in qualified leads. James Rodriguez flagged a need to fix color schemes for
      accessibility in the final creative assets.\n\n### Decisions\n- The group chose
      to focus ad spend on Instagram and LinkedIn instead of spreading it across all
      platforms. (Tom Wilson)\n\n### Key Points\n- **Test Campaign Performance:**
      Sarah noted, \"Click-through rates are averaging 3.2%, which is about 0.8% higher
      than our previous campaigns.\" This shows the current approach is working better
      than before.\n- **Ad Spend Decision:** Sarah laid out two paths: go broad across
      all platforms, or focus on Instagram and LinkedIn. Maya pointed out, \"Our conversion
      rates on Instagram are nearly double what we''re seeing on TikTok,\" and that
      \"lead quality from LinkedIn has been consistently higher.\" This data drove
      the final call.\n- **Q4 Lead Goal:** Sarah stated the team needs \"a 15% increase
      in qualified leads more than we need raw awareness.\" This framed the whole
      budget debate and made the Instagram and LinkedIn focus the clear choice.\n-
      **Creative Asset Reuse:** James noted the team can \"repurpose high-performing
      creative assets\" for the chosen platforms. This saves production costs while
      keeping quality high.\n- **Visual Assets Ready:** James confirmed the main campaign
      visuals are done and shared them with Maya for the social media rollout.\n\n###
      Challenges & Risks\n- **Accessibility of Creative Assets:** James raised a concern
      that \"we might need to adjust some of the color schemes for better accessibility.\"
      This could slow down the rollout if not fixed quickly. James took on the task
      of making those fixes."],"model":"text-embedding-3-small","dimensions":1536,"encoding_format":"base64"}'
