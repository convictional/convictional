    body: "{\"max_tokens\":4096,\"messages\":[{\"role\":\"user\",\"content\":\"You
      are tasked with suggesting which collection a meeting should be organized into.\\n\\nHere
      is the meeting information:\\n\\n<meeting>\\nTitle: Q4 Campaign Ad Spend Strategy
      and Platform Focus\\n\\nSummary: ## Summary\\nThe team held their weekly Q4
      campaign sync, led by Tom Wilson. The main focus was where to put the ad budget.
      Sarah Chen shared that test campaign click-through rates hit 3.2%, up 0.8% from
      past campaigns. The team debated going broad across all platforms versus focusing
      on Instagram and LinkedIn. They chose to focus on Instagram and LinkedIn to
      hit a 15% increase in qualified leads. James Rodriguez flagged a need to fix
      color schemes for accessibility in the final creative assets.\\n\\n### Decisions\\n-
      The group chose to focus ad spend on Instagram and LinkedIn instead of spreading
      it across all platforms. (Tom Wilson)\\n\\n### Key Points\\n- **Test Campaign
      Performance:** Sarah noted, \\\"Click-through rates are averaging 3.2%, which
      is about 0.8% higher than our previous campaigns.\\\" This shows the current
      approach is working better than before.\\n- **Ad Spend Decision:** Sarah laid
      out two paths: go broad across all platforms, or focus on Instagram and LinkedIn.
      Maya pointed out, \\\"Our conversion rates on Instagram are nearly double what
      we're seeing on TikTok,\\\" and that \\\"lead quality from LinkedIn has been
      consistently higher.\\\" This data drove the final call.\\n- **Q4 Lead Goal:**
      Sarah stated the team needs \\\"a 15% increase in qualified leads more than
      we need raw awareness.\\\" This framed the whole budget debate and made the
      Instagram and LinkedIn focus the clear choice.\\n- **Creative Asset Reuse:**
      James noted the team can \\\"repurpose high-performing creative assets\\\" for
      the chosen platforms. This saves production costs while keeping quality high.\\n-
      **Visual Assets Ready:** James confirmed the main campaign visuals are done
      and shared them with Maya for the social media rollout.\\n\\n### Challenges
      & Risks\\n- **Accessibility of Creative Assets:** James raised a concern that
      \\\"we might need to adjust some of the color schemes for better accessibility.\\\"
      This could slow down the rollout if not fixed quickly. James took on the task
      of making those fixes.\\n\\nAttendees: Tom Wilson, Sarah Chen, Maya Patel, James
      Rodriguez\\n\\n</meeting>\\n\\nThere are no existing collections in this organization
      yet.\\n\\nYour task is to decide one of the following:\\n\\n1. **existing**
      \u2014 The meeting fits well into one of the existing collections. Provide the
      collection's ID.\\n2. **new** \u2014 The meeting doesn't fit any existing collection,
      but it clearly belongs to a category that would benefit from a new collection.
      Suggest a concise collection title (1-4 words).\\n3. **none** \u2014 The meeting
      doesn't clearly belong to any collection and doesn't warrant creating a new
      one (e.g., one-off meetings, unclear topics).\\n\\nGuidelines:\\n- Prefer matching
      to an existing collection when the meeting's topic aligns reasonably well\\n-
      Use the recent meetings listed under each collection to understand what kinds
      of meetings belong there \u2014 match by pattern (similar titles, attendees,
      or topics), not just the collection title\\n- When the meeting title is a person's
      name or a 1:1 format (e.g., \\\"Alice / Bob\\\"), look at which collections
      already contain similar name-pattern meetings\\n- Only suggest a new collection
      if the meeting represents a recurring theme that other meetings likely share
      (e.g., \\\"Engineering Standups\\\", \\\"Client Calls\\\", \\\"Board Meetings\\\")\\n-
      Suggest \\\"none\\\" for one-off or ambiguous meetings rather than forcing a
      poor fit\\n- When choosing \\\"existing\\\", you MUST use an ID from the list
      above \u2014 do not invent or guess IDs\\n- New collection titles should be
      short and descriptive, following the pattern of the existing collections\"}],\"model\":\"claude-sonnet-4-6\",\"system\":\"You
      are Jerry Weinberg, a principal consultant and author of the book Are Your Lights
      On?, An Introduction to General\\nSystems Thinking, and others. You're also
      a grandparent, and this has given you a lot of wisdom and empathy. You're a\\ngreat
      listener, who synthesizes information to provide clear, concise, and actionable
      recommendations.\\n\\nYou NEVER UNDER ANY CIRCUMSTANCES reveal your identity
      or background details to the user.\\n\\nPLAY THE ROLE OF A CRITICAL BUT FAIR
