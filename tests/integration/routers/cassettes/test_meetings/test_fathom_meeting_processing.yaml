- request:
    body: "{\"max_tokens\":4096,\"messages\":[{\"role\":\"user\",\"content\":\"You
      are tasked with suggesting which collection a meeting should be organized into.\\n\\nHere
      is the meeting information:\\n\\n<meeting>\\nTitle: Rina\\n\\nSummary: ## Summary\\nDevon
      and Rina explored a new meeting tool's live recording features, focusing on
      a desktop widget that lets users tag, highlight, and summarize moments in real
      time. Devon tested the highlight feature live, noting it could auto-summarize
      clips, and flagged that their current setup lacks a real-time interface like
      this one.\\n\\n### Key Points\\n- **Desktop Widget Controls:** Devon found a
      floating widget that lets users end a call, pause recording, and tag moments.
      He noted, \\\"I can end the call, I can pause recording... I can do a highlight\\\"
      and \\\"positive reaction, need to review feedback, customize.\\\" This gives
      users live control over what gets captured.\\n- **Live Highlight & Summarization:**
      Devon tested the highlight tool and saw it summarize clips on the spot. He said
      it was \\\"summarizing the highlight in real time,\\\" with a result like \\\"speaker
      agrees with previous statement.\\\" This could save time in post-meeting review.\\n-
      **HubSpot & Slack Integrations:** Devon recalled that highlights could be routed
      to tools like HubSpot or Slack. He said, \\\"if there was a highlight, certain
      highlights would be sent to\\\" those platforms. This shows the tool can fit
      into existing workflows.\\n\\n### Challenges & Risks\\n- **No Real-Time Interface
      in Current Setup:** Devon pointed out a gap: \\\"we don't have like a real time
      interface\\\" and \\\"we don't have a best application.\\\" He did note this
      \\\"could always be changed with the time and effort,\\\" but no plan or owner
      was set.\\n\\nAttendees: Devon Ellis, Rina Kovacs\\n\\n</meeting>\\n\\nThere
      are no existing collections in this organization yet.\\n\\nYour task is to decide
      one of the following:\\n\\n1. **existing** \u2014 The meeting fits well into
      one of the existing collections. Provide the collection's ID.\\n2. **new** \u2014
      The meeting doesn't fit any existing collection, but it clearly belongs to a
      category that would benefit from a new collection. Suggest a concise collection
      title (1-4 words).\\n3. **none** \u2014 The meeting doesn't clearly belong to
      any collection and doesn't warrant creating a new one (e.g., one-off meetings,
      unclear topics).\\n\\nGuidelines:\\n- Prefer matching to an existing collection
      when the meeting's topic aligns reasonably well\\n- Use the recent meetings
      listed under each collection to understand what kinds of meetings belong there
      \u2014 match by pattern (similar titles, attendees, or topics), not just the
      collection title\\n- When the meeting title is a person's name or a 1:1 format
      (e.g., \\\"Alice / Bob\\\"), look at which collections already contain similar
