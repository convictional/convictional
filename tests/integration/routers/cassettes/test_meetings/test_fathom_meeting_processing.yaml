- request:
    body: '{"input":["Title: Rina\nDate: No date\nAttendees: Devon Ellis, Rina Kovacs\nAgenda:
      No agenda\nSummary: ## Summary\nDevon and Rina explored a new meeting tool''s
      live recording features, focusing on a desktop widget that lets users tag, highlight,
      and summarize moments in real time. Devon tested the highlight feature live,
      noting it could auto-summarize clips, and flagged that their current setup lacks
      a real-time interface like this one.\n\n### Key Points\n- **Desktop Widget Controls:**
      Devon found a floating widget that lets users end a call, pause recording, and
      tag moments. He noted, \"I can end the call, I can pause recording... I can
      do a highlight\" and \"positive reaction, need to review feedback, customize.\"
      This gives users live control over what gets captured.\n- **Live Highlight &
      Summarization:** Devon tested the highlight tool and saw it summarize clips
      on the spot. He said it was \"summarizing the highlight in real time,\" with
      a result like \"speaker agrees with previous statement.\" This could save time
      in post-meeting review.\n- **HubSpot & Slack Integrations:** Devon recalled
      that highlights could be routed to tools like HubSpot or Slack. He said, \"if
      there was a highlight, certain highlights would be sent to\" those platforms.
      This shows the tool can fit into existing workflows.\n\n### Challenges & Risks\n-
      **No Real-Time Interface in Current Setup:** Devon pointed out a gap: \"we don''t
      have like a real time interface\" and \"we don''t have a best application.\"
      He did note this \"could always be changed with the time and effort,\" but no
      plan or owner was set."],"model":"text-embedding-3-small","dimensions":1536,"encoding_format":"base64"}'
