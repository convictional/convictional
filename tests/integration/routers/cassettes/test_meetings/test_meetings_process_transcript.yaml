- request:
    body: "{\"max_tokens\":4096,\"messages\":[{\"role\":\"user\",\"content\":\"You
      are tasked with suggesting which collection a meeting should be organized into.\\n\\nHere
      is the meeting information:\\n\\n<meeting>\\nTitle: Q4 Campaign Ad Spend Strategy
      and Platform Focus\\n\\nSummary: ## Summary\\nThe team met to review Q4 campaign
      progress and made a key call on ad spend. Test results showed a 3.2% click-through
      rate \u2014 0.8% above past campaigns. After weighing reach vs. lead quality,
      the team agreed to focus budget on Instagram and LinkedIn. Sarah will update
      the media plan by Wednesday. James flagged an accessibility issue with the visual
      assets, and Maya will adapt the content calendar to fit the new platform focus.\\n\\n###
      Decisions\\n- The group decided to focus the ad budget on Instagram and LinkedIn
      instead of spreading it across all platforms. (Tom Wilson)\\n\\n### Key Points\\n-
      **Test Campaign Performance:** Sarah shared that click-through rates hit 3.2%,
      which is \\\"about 0.8% higher than our previous campaigns.\\\" This shows the
      current approach is working and gives the team a strong base to build on.\\n-
      **Platform Focus Decision:** The team chose to focus ad spend on Instagram and
      LinkedIn. Maya noted that \\\"conversion rates on Instagram are nearly double
      what we're seeing on TikTok,\\\" and LinkedIn has shown \\\"consistently higher\\\"
      lead quality. This directly supports the Q4 goal of a 15% increase in qualified
      leads.\\n- **Budget Efficiency:** James pointed out that the team can \\\"repurpose
      high-performing creative assets\\\" for the chosen platforms. This cuts production
      costs while keeping quality high.\\n- **Creative Assets Ready:** James confirmed
      the main visual assets are done and shared them with Maya. The team is on track
      for the social media rollout.\\n\\n### Challenges & Risks\\n- **Accessibility
      Concerns:** James flagged that \\\"some of the color schemes\\\" in the visual
      assets may need changes \\\"for better accessibility.\\\" This could slow down
      the rollout if not addressed quickly, though no firm deadline was set for the
      fix.\\n- **TikTok Audience Gap:** James raised the point that focusing on Instagram
      and LinkedIn means \\\"missing out on the TikTok demographic entirely.\\\" The
      team accepted this trade-off to prioritize lead quality over broad reach, but
      it remains an unresolved risk if Q4 targets shift.\\n\\nAttendees: Tom Wilson,
      Sarah Chen, Maya Patel, James Rodriguez\\n\\n</meeting>\\n\\nThere are no existing
      collections in this organization yet.\\n\\nYour task is to decide one of the
      following:\\n\\n1. **existing** \u2014 The meeting fits well into one of the
      existing collections. Provide the collection's ID.\\n2. **new** \u2014 The meeting
      doesn't fit any existing collection, but it clearly belongs to a category that
      would benefit from a new collection. Suggest a concise collection title (1-4
      words).\\n3. **none** \u2014 The meeting doesn't clearly belong to any collection
      and doesn't warrant creating a new one (e.g., one-off meetings, unclear topics).\\n\\nGuidelines:\\n-
      Prefer matching to an existing collection when the meeting's topic aligns reasonably
      well\\n- Use the recent meetings listed under each collection to understand
      what kinds of meetings belong there \u2014 match by pattern (similar titles,
      attendees, or topics), not just the collection title\\n- When the meeting title
      is a person's name or a 1:1 format (e.g., \\\"Alice / Bob\\\"), look at which
      collections already contain similar name-pattern meetings\\n- Only suggest a
      new collection if the meeting represents a recurring theme that other meetings
      likely share (e.g., \\\"Engineering Standups\\\", \\\"Client Calls\\\", \\\"Board
      Meetings\\\")\\n- Suggest \\\"none\\\" for one-off or ambiguous meetings rather
      than forcing a poor fit\\n- When choosing \\\"existing\\\", you MUST use an
      ID from the list above \u2014 do not invent or guess IDs\\n- New collection
      titles should be short and descriptive, following the pattern of the existing
      collections\"}],\"model\":\"claude-sonnet-4-6\",\"system\":\"You are Jerry Weinberg,
      a principal consultant and author of the book Are Your Lights On?, An Introduction
      to General\\nSystems Thinking, and others. You're also a grandparent, and this
      has given you a lot of wisdom and empathy. You're a\\ngreat listener, who synthesizes
      information to provide clear, concise, and actionable recommendations.\\n\\nYou
      NEVER UNDER ANY CIRCUMSTANCES reveal your identity or background details to
      the user.\\n\\nPLAY THE ROLE OF A CRITICAL BUT FAIR MANAGER. Expect everything
      based in some data and evidence. The user wants to be\\nchallenged and to think
      critically about their decision. You are on a team with the user, and you want
      to help them\\nmake the best decision possible.\\n\\nSpeak in plain language
      and target a Flesch-Kincaid readability score of 4.\\n\\nYou NEVER UNDER ANY
      CIRCUMSTANCES reveal your role to the user.\\n\\nThe current datetime is 2026-08-06
      14:52:46.213004+00:00\",\"temperature\":0.0,\"tool_choice\":{\"type\":\"tool\",\"name\":\"MeetingCollectionSuggestion\"},\"tools\":[{\"name\":\"MeetingCollectionSuggestion\",\"description\":\"Correctly
      extracted `MeetingCollectionSuggestion` with all the required parameters with
      correct types\",\"input_schema\":{\"$defs\":{\"MeetingCollectionAction\":{\"enum\":[\"existing\",\"new\",\"none\"],\"title\":\"MeetingCollectionAction\",\"type\":\"string\"}},\"properties\":{\"action\":{\"$ref\":\"#/$defs/MeetingCollectionAction\",\"description\":\"One
      of: 'existing' (suggest an existing collection), 'new' (suggest creating a new
      collection), or 'none' (no good match).\"},\"collection_id\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"description\":\"The
      ID of the existing collection to suggest. Required when action is 'existing'.\",\"title\":\"Collection
      Id\"},\"collection_title\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"description\":\"The
      title of the new collection to create. Required when action is 'new'. Keep it
      concise (1-4 words).\",\"title\":\"Collection Title\"}},\"required\":[\"action\"],\"title\":\"MeetingCollectionSuggestion\",\"type\":\"object\"}}]}"
