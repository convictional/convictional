      task is to extract a list of learnings from the context that are relevant to
      the topic and directions provided.\\nReturn a maximum of 10 learnings, but feel
      free to return less if the contents are clear.\\n\\nFollow these guidelines:\\n1.
      Each learning should be unique and not repetitive.\\n2. Include any entities
      mentioned in the context, such as people, places, companies, products, or things.\\n3.
      Pay special attention to exact metrics, numbers, and dates. Dates are particularly
      important and should always be included when present.\\n4. Ensure that each
      learning is directly related to the topic and directions.\\n5. Present the learnings
      in a clear, concise manner.\\n6. Go beyond bare facts \u2014 include explanatory
      context: WHY something happened, HOW it relates to the broader topic, and WHAT
      the implications are. When the source provides enough context, write 2-3 sentence
      learnings instead of single terse statements.\\n- Before: \\\"Revenue grew 15%
