  - key: engineering-chat-msg-021
    author: jordan
    at: !relative_day {offset: -4, hour: 15, minute: 10}
    content: |
      Here's the retrieval config that's working best on the MSA benchmark:
      ```
      retriever:
        top_k: 8
        rerank_top_k: 3
        passage_size: 512
        overlap: 64
      ```
      Top_k below 6 hurts recall noticeably. 8 is the sweet spot.

  - key: engineering-chat-msg-022
    author: arjun
    at: !relative_day {offset: -4, hour: 15, minute: 22}
    reply_to: engineering-chat-msg-021
    content: |
      Any cost signal on top_k 8 vs 6? The rerank isn't free.

  - key: engineering-chat-msg-023
    author: jordan
    at: !relative_day {offset: -4, hour: 15, minute: 30}
    reply_to: engineering-chat-msg-022
    content: |
      ~18% more compute per call but the quality delta is worth it. I'll add the cost curve to the eval doc.
    reactions:
      eyes: [arjun, priya]

