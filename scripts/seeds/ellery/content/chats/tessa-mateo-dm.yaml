  - key: tessa-mateo-dm-msg-008
    author: mateo
    at: !relative_day {offset: -7, hour: 10, minute: 30}
    content: |
      Coaching ask — Amira pushed back on the volume commit language. She wants the phrase "good-faith estimate" instead of a floor. How do I hold the line without getting hard?

  - key: tessa-mateo-dm-msg-009
    author: tessa
    at: !relative_day {offset: -7, hour: 10, minute: 42}
    reply_to: tessa-mateo-dm-msg-008
    content: |
      Name it as a shared problem. "Amira, our pricing needs to match the commitment. If we move to good-faith, the per-unit goes up by X. Would you rather a soft floor at the current rate, or the flexibility at the higher rate?" Give her the choice. The choice is the magic.

  - key: tessa-mateo-dm-msg-010
    author: mateo
    at: !relative_day {offset: -7, hour: 10, minute: 50}
    reply_to: tessa-mateo-dm-msg-009
    content: |
      Got it. Using this tomorrow. Thank you.
    reactions:
      heart: [tessa]

  - key: tessa-mateo-dm-msg-011
