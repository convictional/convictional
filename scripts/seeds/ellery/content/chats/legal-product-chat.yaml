    author: rhea
    at: !relative_day {offset: -6, hour: 20, minute: 18}
    reply_to: legal-product-chat-msg-011
    content: |
      That's the right voice. The memo is strongest when the data does the pointed part, not the prose.
    reactions:
      heart: [maren]

  - key: legal-product-chat-msg-013
    author: maren
    at: !relative_day {offset: -1, hour: 8, minute: 30}
