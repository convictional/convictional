[project]
name = "convictional"
version = "0.0.1"
description = ""
authors = [
    { name = "Convictional", email = "decide@convictional.com" },
    { name = "Ben Crouse", email = "bencrouse@gmail.com" },
    { name = "Jake Beresford", email = "hello@jakeberesford.com" },
    { name = "Thomas Gorham", email = "tgiv014@gmail.com" },
    { name = "Prentice Bjerkseth", email = "prenticebjerk@gmail.com" },
    { name = "Nick Wehner", email = "Nicholas.wehner@gmail.com" },
]
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "fastapi>=0.140.13",
    "uvicorn>=0.52.0,<0.53",
    "gunicorn>=26.0.0,<27",
    "pydantic==2.13.5",
    "pydantic-settings>=2.14.2,<3",
    "google-cloud-logging>=3.16.1,<4",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.32,<0.0.33",
    "httpx>=0.28.1,<0.29",
    "sentry-sdk[fastapi, asyncpg]>=2.66.1,<3",
    "itsdangerous>=2.2.0,<3",
    "cryptography>=50.0.0,<51",
    "google-cloud-tasks>=2.23.0,<3",
    "openai>=2.51.0,<3",
    "sse-starlette>=3.4.6,<4",
    "mistune>=3.3.4,<4",
    "google-cloud-storage>=3.13.0,<4",
    "tortoise-orm[asyncpg]>=0.25.1,<0.26",
    "aerich>=0.9.3,<0.11",
    "instructor<1.16.1",
    "tiktoken>=0.13.0,<0.15",
    "types-protobuf>=7.34.1.20260518,<8",
    "bs4>=0.0.2,<0.0.3",
    "svix>=1.99.1,<2",
    "numpy>=2.5.1,<3",
    "webvtt-py>=0.5.1,<0.6",
    "pyjwt>=2.13.0,<3",
    "anthropic>=0.120.2,<0.123",
    "google-api-python-client>=2.198.0,<3",
    "croniter>=6.2.4,<7",
    "python-magic>=0.4.27,<0.5",
    "pycrdt>=0.14.2,<0.15",
    "cffi>=2.1.0,<3",
    "nh3>=0.3.6,<0.4",
    "websockets>=16.1.1,<17",
    "urllib3>=2.7.0,<3",
    "slack-sdk>=3.43.0",
    "tenacity>=9.1.2",
    "fastmcp>=3.4.5,<4",
    "pillow>=12.3.0",
    "pywebpush>=2.0.0,<3",
    "notion-client>=3.1,<4",
]

[dependency-groups]
development = [
    "ruff>=0.16.1,<0.17",
    "mypy>=2.3.0,<3",
    "ipython>=9.16.0,<10",
    "import-linter~=2.13",
    "djlint>=1.43.1,<2",
    "asyncpg-stubs>=0.31.3,<0.32",
    "pre-commit>=4.6.1,<5",
    "watchfiles>=1.2.0,<2",
    "google-auth-stubs>=0.3.0,<0.4",
    "types-pygments>=2.20.0.20260728,<3",
    "pygments>=2.19.2,<3",
    "python-slugify>=8.0.4,<9",
    "google-genai>=2.16.0,<3",
    "google-api-python-client-stubs>=1.39.0,<2",
    "honcho>=2.0.0,<3",
    "types-croniter>=6.2.4.20260711,<7",
    "python-frontmatter>=1.3.0",
    "zizmor==1.30.0",
]
test = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-random-order>=1.2.0,<2",
    "types-beautifulsoup4>=4.12.0.20250516,<5",
    "pytest-recording>=0.13.4,<0.14",
    # vcrpy is pulled in by pytest-recording; pin >=8.2.0, the first release whose
    # aiohttp stub works with aiohttp 3.14 (which removed streams.AsyncStreamReaderMixin).
    "vcrpy>=8.3.0",
    "pytest-xdist>=3.8.0,<4",
    "httpx-ws>=0.9.0,<0.10",
    "wsproto>=1.3.2,<2",
    "pytest-timeout>=2.4.0,<3",
    "freezegun>=1.5.5,<2",
    "pytest-playwright-asyncio>=0.8.0,<0.10",
]

[tool.uv]
package = false
default-groups = [
    "development",
    "test",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "requires_config: test requires additional config to re-record VCR",
    "disable_vcr: disable automatic VCR recording for this test",
    "real_embeddings: use recorded OpenAI embeddings instead of the fake backend (for semantic search/ranking assertions)",
]
timeout = 15

[tool.aerich]
tortoise_orm = "config.aerich.config"
location = "./migrations"
src_folder = "./."

[tool.mypy]
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = [".venv"]

[[tool.mypy.overrides]]
module = "nh3.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "google.cloud.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bm25s.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["frontmatter.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"

[tool.ruff]
line-length = 119
exclude = ["migrations/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "TID", "UP", "PLC"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
    "F401",
] # Ignore unused imports in __init__.py files, they are used as namespaces
"app/organization_setup.py" = [
    "E501",
] # Holds the seeded onboarding doc as long-form markdown prose; paragraphs are single lines by design

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dateutil.tz".msg = "Use `zoneinfo` instead."
"pytz".msg = "Use `zoneinfo` instead."

[tool.djlint]
profile = "jinja"
extension = "html.jinja"
ignore = "H006,H023,H030,H031,T028"
